[platformio]
default_envs = joystick-v2-core2

; PlatformIO Project Configuration File
;
; Deux matériels, un seul code : choisir l'environnement.
;   pio run -e joystick-v2-core2   -> Core2 + ExtPort (JOYSTICK_HW=2)
;   pio run -e joystick-v1-atoms3  -> AtomS3 + STM32   (JOYSTICK_HW=1, ex-BuoyJoystick)
; Le reste de la configuration (communication, radio, essais) est dans
; include/JoystickConfiguration.h.
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps = 
    m5stack/M5GFX@^0.1.16
    m5stack/M5Unified@^0.1.17
    https://github.com/m5stack/M5-LoRa-E220-JP.git

[env:joystick-v2-core2]
board = m5stack-core2
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_M5STACK_CORE2
    -DJOYSTICK_HW=2
build_src_filter = +<*> -<JoystickManagerV1.cpp> -<DisplayManagerV1.cpp>

[env:joystick-v1-atoms3]
board = m5stack-atoms3
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_M5STACK_ATOMS3
    -DJOYSTICK_HW=1
build_src_filter = +<*> -<JoystickManagerV2.cpp> -<DisplayManagerV2.cpp>
